<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<style>
.sp{animation:sp 80s linear infinite;transform-box:view-box;transform-origin:50px 50px}
.sr{animation:sp 50s linear infinite reverse;transform-box:view-box;transform-origin:50px 50px}
.bob{animation:bob 4.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
.tw{animation:tw 2.6s ease-in-out infinite}
.gl{animation:gl 3.6s ease-in-out infinite}
.bb{animation:bb 5s ease-in infinite;transform-box:fill-box;transform-origin:center}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes bob{from{transform:translateY(-1.6px)}to{transform:translateY(1.6px)}}
@keyframes sw{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes gl{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes bb{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-9px);opacity:0}}
</style>
