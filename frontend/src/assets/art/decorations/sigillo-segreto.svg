<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<style>
.sp{animation:sp 40s linear infinite;transform-box:fill-box;transform-origin:center}
.sr{animation:sp 30s linear infinite reverse;transform-box:fill-box;transform-origin:center}
.sf{animation:sp 11s linear infinite;transform-box:fill-box;transform-origin:center}
.tw{animation:tw 2.2s ease-in-out infinite}
.br{animation:br 4.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.wl{animation:wl 4.2s ease-in-out infinite;transform-box:fill-box;transform-origin:100% 55%}
.wr{animation:wl 4.2s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 55%}
.bob{animation:bob 3.4s ease-in-out infinite}
.rise{animation:rise 4.6s ease-in infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes br{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
@keyframes wl{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-3.5deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-34px);opacity:0}}
</style>
