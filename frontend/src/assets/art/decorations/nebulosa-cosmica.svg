<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="dc-nebula-bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#c084fc" stop-opacity="0.8"></stop><stop offset="60%" stop-color="#38bdf8" stop-opacity="0.3"></stop><stop offset="100%" stop-color="#000000" stop-opacity="0"></stop></radialGradient>
    <filter id="dc-heavy-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="blur"></feGaussianBlur></filter>
    <linearGradient id="dc-nebula-ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a855f7"></stop><stop offset="50%" stop-color="#ec4899"></stop><stop offset="100%" stop-color="#38bdf8"></stop></linearGradient>
    <filter id="dc-soft-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5" result="coloredBlur"></feGaussianBlur><feMerge><feMergeNode in="coloredBlur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter>
    <linearGradient id="dc-comet-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity="1"></stop><stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8"></stop><stop offset="100%" stop-color="#a855f7" stop-opacity="0"></stop></linearGradient>
  </defs>
  <g transform="translate(50 50)"><circle r="42" fill="url(#dc-nebula-bg)" opacity="0.4" filter="url(#dc-heavy-glow)" class="dc-pulse-slow"></circle><g class="dc-spin-slow"><ellipse cx="0" cy="0" rx="44" ry="16" fill="none" stroke="url(#dc-nebula-ring)" stroke-width="3" transform="rotate(-28)" filter="url(#dc-soft-glow)"></ellipse><ellipse cx="0" cy="0" rx="44" ry="16" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 12" transform="rotate(-28)"></ellipse></g><g class="dc-spin-rev"><path d="M-32 -32 L-20 -28 L-28 -20 Z" fill="#a855f7" filter="url(#dc-soft-glow)"></path><path d="M25 25 L38 20 L30 35 Z" fill="#ec4899" filter="url(#dc-soft-glow)"></path><circle cx="28" cy="-28" r="2" fill="#ffffff" class="dc-twinkle"></circle><circle cx="-30" cy="25" r="2.5" fill="#38bdf8" class="dc-twinkle" style="animation-delay:0.7s"></circle></g><g class="dc-comet-path"><path d="M-45 -40 Q0 -30 45 35" fill="none" stroke="url(#dc-comet-grad)" stroke-width="2" stroke-linecap="round" filter="url(#dc-soft-glow)"></path></g></g>
</svg>
