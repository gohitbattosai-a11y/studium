<path d="M62 56 C66 55 70 56 71 59" stroke="#ffd1b8" stroke-width="1" fill="none" stroke-linecap="round" opacity=".8"/>
<g class="stk"><path d="M41 18 C42 6 54 1 62 9" stroke="#8b6bd1" stroke-width="1.5" fill="none" stroke-linecap="round"/></g>
