<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80">
<style>
.lan{animation:lan 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.lan2{animation:lan 2.4s ease-in-out infinite;animation-delay:-1.2s;transform-box:fill-box;transform-origin:center}
.stk{animation:stk 3.2s ease-in-out infinite alternate;transform-box:view-box;transform-origin:41px 17px}
.clw{animation:clw 2.8s ease-in-out infinite alternate;transform-box:view-box;transform-origin:72px 56px}
.bub{animation:bub 4s ease-in infinite}
.bub2{animation:bub 4s ease-in infinite;animation-delay:-2s}
.spk{animation:spk 2.2s ease-in-out infinite}
@keyframes lan{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1.18)}}
@keyframes stk{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes clw{from{transform:rotate(-5deg)}to{transform:rotate(7deg)}}
@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-16px);opacity:0}}
@keyframes spk{0%,100%{opacity:.2}50%{opacity:1}}
</style>
<defs>
<radialGradient id="sh" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff1f7"/><stop offset=".45" stop-color="#f0b8dd"/><stop offset="1" stop-color="#7c4fb3"/></radialGradient>
<linearGradient id="bd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a7a"/><stop offset="1" stop-color="#d9435a"/></linearGradient>
<linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb08f"/><stop offset="1" stop-color="#b8334e"/></linearGradient>
<radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#d6fff7" stop-opacity=".95"/><stop offset=".45" stop-color="#5eead4" stop-opacity=".5"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
</defs>
<ellipse cx="50" cy="72" rx="36" ry="4" fill="#02121b" opacity=".45"/>
<g class="pt-leg pt-leg-b"><path d="M48 62 L43 66 L41 71" stroke="#b8334e" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 63 L55 67 L54 71.5" stroke="#b8334e" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
