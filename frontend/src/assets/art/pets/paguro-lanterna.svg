<circle cx="66" cy="2" r="1.1" fill="none" stroke="#bdfcf0" stroke-width=".6" class="bub"/><circle cx="58" cy="3" r=".8" fill="none" stroke="#bdfcf0" stroke-width=".6" class="bub2"/>
</svg>
