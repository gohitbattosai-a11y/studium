<path d="M44 14 C58 20 62 40 54 52" stroke="#a97ad8" stroke-width="1" fill="none" opacity=".7"/>
<path d="M18 50 C28 62 46 64 56 56" stroke="#a97ad8" stroke-width="1" fill="none" opacity=".7"/>
