<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <style>
      .orbit { transform-box: fill-box; transform-origin: center; animation: giro 6s linear infinite; }
      .gem { transform-box: fill-box; transform-origin: center; animation: pulsa 1.6s ease-in-out infinite alternate; }
      @keyframes giro { to { transform: rotate(360deg); } }
      @keyframes pulsa { from { transform: scale(0.7); opacity: 0.6; } to { transform: scale(1.2); opacity: 1; } }
    </style>
  </defs>
  <circle cx="50" cy="50" r="30" fill="none" stroke="url(#g)" stroke-width="2.4"/>
  <g class="orbit">
    <circle class="gem" cx="50" cy="19" r="3.2" fill="#fde68a"/>
    <circle class="gem" cx="81" cy="50" r="2.4" fill="#fff"/>
    <circle class="gem" cx="50" cy="81" r="3.2" fill="#fde68a"/>
    <circle class="gem" cx="19" cy="50" r="2.4" fill="#fff"/>
  </g>
</svg>
