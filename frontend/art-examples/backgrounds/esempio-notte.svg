<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#2a1b4d"/>
    </linearGradient>
    <style>
      .star { animation: lampeggia 3s ease-in-out infinite; }
      .s2 { animation-delay: -1s; }
      .s3 { animation-delay: -2s; }
      @keyframes lampeggia { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle class="star" cx="300" cy="200" r="3" fill="#fff"/>
  <circle class="star s2" cx="900" cy="140" r="2.5" fill="#fff"/>
  <circle class="star s3" cx="1300" cy="320" r="3" fill="#fff"/>
  <circle class="star s2" cx="600" cy="420" r="2" fill="#fff"/>
  <path d="M0 760 L260 560 L520 720 L820 500 L1120 700 L1380 560 L1600 700 L1600 900 L0 900 Z" fill="#120a26"/>
</svg>
